CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_POINTING=y

# Screen never turns off (default is 600 s)
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=0

# ZMK also merges velvet_v3.conf into this build (shield name stripping:
# velvet_v3_ui_qube -> velvet_v3_ui -> velvet_v3), so re-assert these here.
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10
