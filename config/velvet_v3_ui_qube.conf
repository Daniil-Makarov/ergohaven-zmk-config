# Screen never turns off (default is 600 s)
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=0

# ZMK also merges velvet_v3_ui.conf into this build (shield name stripping:
# velvet_v3_ui_qube -> velvet_v3_ui), and this file is applied last.
# The dongle is USB powered and has no keys to wake it, so never sleep.
CONFIG_ZMK_SLEEP=n

# 5 BLE profiles (BT_SEL 0-4) on top of the two halves: 5 + 2 connections.
# The default of 6 leaves only 4 profiles on the dongle.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
